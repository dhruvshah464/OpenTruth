[project]
name = "opentruth"
version = "0.1.0"
description = "Independent verification engine: did the software actually satisfy the requirement?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Dhruv Shah" }]
keywords = ["verification", "evidence", "playwright", "ai-agents"]
dependencies = [
    "pyyaml>=6.0",
    "playwright>=1.49",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
]

[project.scripts]
opentruth = "opentruth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opentruth"]

[tool.hatch.build.targets.wheel.force-include]
"opentruth/site" = "opentruth/site"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = [
    "browser: tests that launch Chromium via Playwright",
]
