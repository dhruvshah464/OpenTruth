name: OpenTruth

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pytest
        run: pytest -m "not browser" -q

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove MiniAuth (API)
        uses: ./
        with:
          path: examples/miniauth
          mode: api
          persist-session: "true"
          artifact-name: opentruth-miniauth
      - name: Prove MiniTodos (API IR)
        uses: ./
        with:
          path: examples/minitodos
          mode: api
          artifact-name: opentruth-minitodos
        env:
          MINITODOS_PERSIST_COMPLETE: "1"
